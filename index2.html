<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ورتل القرآن ترتيلاً — القرآن الكريم</title>

<!-- تم إضافة هذا السطر فقط لضمان وجود خط يدعم النص العربي القرآني -->
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New&display=swap" rel="stylesheet">

<style>
:root{
  --green:#3ea34a;
  --dark:#666;
  --header-bg:#5b5b5b;
  --accent:#2f8f3a;
}
*{box-sizing:border-box}
body{
  font-family:'Scheherazade New','Amiri','Segoe UI', Tahoma, Arial, sans-serif;
  margin:0;
  background:#fff;
  color:#222;
  direction:rtl;
  text-align:right;
}
a{color:inherit}

header{background:var(--header-bg);color:white;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hdr-right{font-family:'Scheherazade New','Amiri',serif;font-size:20px;}
.hdr-center{font-weight:700;color:var(--green);font-size:20px;text-align:center}
.hdr-left{display:flex;gap:12px;align-items:center;margin-top:8px;}
.mode-bar{background:rgba(255,255,255,0.06);padding:8px;border-radius:6px;display:flex;gap:6px}
.mode-btn{background:transparent;border:1px solid rgba(255,255,255,0.08);padding:8px 12px;color:white;cursor:pointer;border-radius:6px;transition:0.2s}
.mode-btn:hover{background:rgba(255,255,255,0.1)}

.container{max-width:1100px;margin:40px auto;padding:0 18px}

.section{margin-top:48px;text-align:center}
.section h2{color:var(--green);margin:0;font-size:28px;font-weight:700}
.section .sub{margin-top:12px;color:var(--dark)}

.player-panel{display:flex;gap:20px;align-items:flex-start;justify-content:center;margin-top:28px;flex-wrap:wrap}
.panel{background:#f9f9f9;border-radius:8px;padding:18px;min-width:280px;box-shadow:0 2px 0 rgba(0,0,0,0.03)}
label{display:block;margin-bottom:8px;color:var(--dark)}
select{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;font-size:16px;cursor:pointer;transition:0.2s;background:#fff;direction:rtl;text-align:right}
select:hover{border-color:var(--green)}
input{font-size:14px;padding:10px;border-radius:6px;border:1px solid #ddd;width:100%;direction:rtl;text-align:right}

.verse-list{max-height:500px;overflow-y:auto;padding:8px;text-align:right;direction:rtl}
.verse{
  background:#fff;
  border-radius:8px;
  padding:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
  margin-bottom:12px;
  font-size:22px;
  line-height:2.2;
  cursor:pointer;
  transition:0.2s;
  text-align:right;
  direction:rtl;
  word-wrap:break-word;
  white-space:normal;
}
.verse:hover{transform: translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,0.12);}
.verse .meta{font-size:13px;color:#555;margin-bottom:6px}

.audio-controls{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--green);color:white;padding:10px 18px;border-radius:4px;border:none;cursor:pointer;transition:0.2s}
.btn:hover{background:var(--accent)}
.btn.small{padding:8px 10px;font-size:14px}

@media(max-width:1024px){
  .player-panel{flex-direction:column}
}
@media(max-width:720px){
  header{flex-direction:column;gap:8px;align-items:flex-start}
  select{font-size:14px;padding:10px}
  .verse{font-size:20px;padding:14px;line-height:2}
}
</style>
</head>
<body>
<header>
  <div class="hdr-right">وَرَتِّلِ القرآن تَرْتِيلًا</div>
  <div class="hdr-center">القرآن الكريم</div>
  <div class="hdr-left">
    <nav class="mode-bar">
      <button class="mode-btn" id="go-listen">الاستماع</button>
      <button class="mode-btn" id="go-read">القراءة</button>
    </nav>
  </div>
</header>

<main class="container">
  <!-- القراءة -->
  <section class="section" id="readingSection">
    <h2>القراءة</h2>
    <div class="sub">اختر السورة لعرض آياتها</div>
    <div class="player-panel">
      <div class="panel" style="flex:1; max-width:450px">
        <label>السورة</label>
        <select id="surahSelect" size="12" style="height:400px"></select>
        <label style="margin-top:12px">بحث سريع (اسم السورة)</label>
        <input id="surahSearch" placeholder="ابحث عن اسم السورة">
      </div>
      <div class="panel" style="flex:2">
        <label>الآيات</label>
        <div class="verse-list" id="verseList">
          <div style="color:#666;padding:8px;text-align:center">اختر سورة لعرض الآيات</div>
        </div>
      </div>
    </div>
  </section>

  <!-- الاستماع -->
  <section class="section" id="listeningSection" style="margin-top:48px">
    <h2>الاستماع</h2>
    <div class="sub">اختر السورة ثم القارئ ثم اضغط تشغيل</div>
    <div class="player-panel">
      <div class="panel" style="max-width:360px">
        <label>السورة</label>
        <select id="surahSelectAudio" size="10" style="height:300px"></select>
        <label style="margin-top:12px">القارئ</label>
        <select id="reciterSelect"></select>
        <div class="audio-controls">
          <button class="btn small" id="playBtn">تشغيل</button>
          <button class="btn small" id="pauseBtn">إيقاف</button>
          <button class="btn small" id="prevAyah">السابق</button>
          <button class="btn small" id="nextAyah">التالي</button>
        </div>
        <div style="margin-top:8px;font-size:13px;color:#666">الآية الحالية: <span id="currentAyahIndex">-</span></div>
      </div>
      <div class="panel" style="flex:2">
        <label>قائمة الآيات (اضغط للانتقال أو التشغيل)</label>
        <div class="verse-list" id="audioVerseList">اختر سورة للاستماع</div>
      </div>
    </div>
    <audio id="audioPlayer" controls style="width:100%; margin-top:14px"></audio>
  </section>
</main>

<script>
const API_BASE='https://api.alquran.cloud/v1';
const surahSelect=document.getElementById('surahSelect');
const surahSelectAudio=document.getElementById('surahSelectAudio');
const verseList=document.getElementById('verseList');
const audioVerseList=document.getElementById('audioVerseList');
const reciterSelect=document.getElementById('reciterSelect');
const audioPlayer=document.getElementById('audioPlayer');
const playBtn=document.getElementById('playBtn');
const pauseBtn=document.getElementById('pauseBtn');
const prevAyahBtn=document.getElementById('prevAyah');
const nextAyahBtn=document.getElementById('nextAyah');
const currentAyahIndex=document.getElementById('currentAyahIndex');

let surahs=[],currentSurah=null,audioQueue=[],audioIndex=0;

async function loadReciters(){
  try{
    const res=await fetch(`${API_BASE}/edition/format/audio`);
    const data=await res.json();
    const editions=data.data||[];
    const prefer=['ar.alafasy','ar.abdulbasitmurattal','ar.minshawi','ar.hani'];
    reciterSelect.innerHTML='';
    prefer.forEach(k=>{
      const found=editions.find(e=>e.identifier===k);
      if(found){ const opt=document.createElement('option'); opt.value=found.identifier; opt.textContent=found.name; reciterSelect.appendChild(opt); }
    });
    editions.forEach(e=>{
      if([...reciterSelect.options].some(o=>o.value===e.identifier)) return;
      const opt=document.createElement('option'); opt.value=e.identifier; opt.textContent=e.name; reciterSelect.appendChild(opt);
    });
  }catch(err){ reciterSelect.innerHTML='<option value="ar.alafasy">Mishary Alafasy (افتراضى)</option>'; }
}

async function loadSurahs(){
  const res=await fetch(`${API_BASE}/surah`);
  const j=await res.json();
  surahs=j.data||j;
  surahSelect.innerHTML=''; surahSelectAudio.innerHTML='';
  surahs.forEach(s=>{
    const opt=document.createElement('option'); opt.value=s.number; opt.textContent=`${s.number} — ${s.name}`;
    surahSelect.appendChild(opt);
    surahSelectAudio.appendChild(opt.cloneNode(true));
  });
}

async function loadSurahDetails(num){
  // تم التعديل هنا لاستخدام النسخة العادية (quran-simple) عشان تتفادى رموز النص العثماني
  const res=await fetch(`${API_BASE}/surah/${num}/quran-simple`);
  const j=await res.json();
  return j.data||j;
}

async function showSurah(num){
  currentSurah=await loadSurahDetails(num);
  verseList.innerHTML='';
  currentSurah.ayahs.forEach(a=>{
    const div=document.createElement('div'); div.className='verse';
    div.innerHTML=`<div class="meta">آية ${a.numberInSurah}</div><div class="arabic">${a.text}</div>`;
    verseList.appendChild(div);
  });
  // تمرير تلقائي لأول آية عند تغيير السورة
  verseList.scrollTop = 0;
}

async function prepareAudioSurah(num,reciterId){
  const s=await loadSurahDetails(num);
  audioQueue=s.ayahs.map(a=>({ayahNum:a.number,text:a.text,inSurah:a.numberInSurah}));
  audioIndex=0;
  audioVerseList.innerHTML='';
  audioQueue.forEach((item,idx)=>{
    const d=document.createElement('div'); d.className='verse';
    d.innerHTML=`<div class="meta">آية ${item.inSurah}</div><div class="arabic">${item.text}</div>`;
    d.addEventListener('click',()=>{ playAyahAt(idx,reciterId); });
    audioVerseList.appendChild(d);
  });
  currentAyahIndex.textContent=`${audioIndex+1} / ${audioQueue.length}`;
}

function audioUrlFor(ayahGlobalNumber,edition){ return `${API_BASE}/ayah/${ayahGlobalNumber}/${edition}`; }

async function playAyahAt(idx,edition){
  if(!audioQueue.length) return;
  audioIndex=idx;
  const ay=audioQueue[audioIndex];
  currentAyahIndex.textContent=`${audioIndex+1} / ${audioQueue.length}`;
  const res=await fetch(audioUrlFor(ay.ayahNum,edition));
  const j=await res.json();
  if(j && j.data && j.data.audio){ audioPlayer.src=j.data.audio; audioPlayer.play().catch(()=>{}); }
  else if(j && j.data && j.data.audioSecondary){ audioPlayer.src=j.data.audioSecondary; audioPlayer.play().catch(()=>{}); }
}

function playNext(edition){ if(audioIndex<audioQueue.length-1) playAyahAt(audioIndex+1,edition); }
function playPrev(edition){ if(audioIndex>0) playAyahAt(audioIndex-1,edition); }

surahSelect.addEventListener('change',(e)=> showSurah(e.target.value));
surahSelectAudio.addEventListener('change',async(e)=>{
  const num=e.target.value; const reciterId=reciterSelect.value;
  await prepareAudioSurah(num,reciterId);
  playAyahAt(0,reciterId);
});

playBtn.addEventListener('click',()=>{
  const edition=reciterSelect.value||'ar.alafasy';
  if(!audioQueue.length){ const num=surahSelectAudio.value||1; prepareAudioSurah(num,edition).then(()=>playAyahAt(0,edition)); }
  else{ if(audioPlayer.src) audioPlayer.play().catch(()=>{}); else playAyahAt(audioIndex,edition); }
});
pauseBtn.addEventListener('click',()=>audioPlayer.pause());
nextAyahBtn.addEventListener('click',()=>playNext(reciterSelect.value));
prevAyahBtn.addEventListener('click',()=>playPrev(reciterSelect.value));
audioPlayer.addEventListener('ended',()=>{ if(audioIndex<audioQueue.length-1) playAyahAt(audioIndex+1,reciterSelect.value); });

document.getElementById('go-listen').addEventListener('click',()=>{ document.getElementById('listeningSection').scrollIntoView({behavior:'smooth'}); });
document.getElementById('go-read').addEventListener('click',()=>{ document.getElementById('readingSection').scrollIntoView({behavior:'smooth'}); });

document.getElementById('surahSearch').addEventListener('input',(e)=>{
  const q=e.target.value.trim().toLowerCase();
  [...surahSelect.options].forEach(opt=>{ opt.hidden=q && !opt.textContent.toLowerCase().includes(q); });
});

(async function init(){ await loadReciters(); await loadSurahs(); surahSelect.value=1; surahSelectAudio.value=1; showSurah(1); })();
</script>
</body>
</html>
